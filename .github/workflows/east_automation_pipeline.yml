name: Run Early Alert Screening Tool Pipelines

on:
  # Runs twice daily at 00:00 and 12:00 Eastern Daylight Time (EDT)
  schedule:
    - cron: '0 4,16 * * *'
  
  # Enables manual triggering from GitHub interface
  workflow_dispatch:

jobs:
  execute-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Configure Copernicus CDS API credentials
      - name: Configure CDS API Credentials
        run: |
          echo "${{ secrets.CDSAPIRC_CONTENT }}" > ~/.cdsapirc

      # 4. Install OS-level C/C++ spatial dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      # 5. Install Python packages and Jupyter nbconvert
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert

      # 6. Execute Hazard Data Pipeline (dashboard.ipynb)
      - name: Run Hazards Pipeline (dashboard.ipynb)
        env:
          AGOL_CLIENT_ID: ${{ secrets.AGOL_CLIENT_ID }}
          AGOL_CLIENT_SECRET: ${{ secrets.AGOL_CLIENT_SECRET }}
          AGOL_LAYER_ID_2: ${{ secrets.AGOL_LAYER_ID_1 }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          jupyter nbconvert --execute --to notebook --inplace dashboard.ipynb

      # 7. Execute AI News Agent Pipeline (news_monitor.ipynb)
      - name: Run AI News Agent (news_monitor.ipynb)
        env:
          AGOL_CLIENT_ID: ${{ secrets.AGOL_CLIENT_ID }}
          AGOL_CLIENT_SECRET: ${{ secrets.AGOL_CLIENT_SECRET }}
          AGOL_LAYER_ID_2: ${{ secrets.AGOL_LAYER_ID_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Add if your agent uses LLM API keys
        run: |
          jupyter nbconvert --execute --to notebook --inplace news_monitor.ipynb
